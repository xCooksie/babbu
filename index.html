<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해랑달 상점 열람</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e8e8e4;
    padding: 0 24px;
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    padding-right: 24px;
    border-right: 1px solid #e8e8e4;
    margin-right: 8px;
    letter-spacing: -0.01em;
  }

  .header-title span {
    color: #888;
    font-weight: 400;
    margin-left: 6px;
    font-size: 13px;
  }

  nav {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 500;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
    height: 52px;
  }

  .tab:hover { color: #1a1a1a; }

  .tab.active {
    color: #1a1a1a;
    border-bottom-color: #1a1a1a;
  }

  .tab-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }

  .badge-green {
    background: #e6f4ea;
    color: #1e7e34;
  }

  .badge-blue {
    background: #e8f0fe;
    color: #1558d6;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .panel {
    display: none;
    flex: 1;
    flex-direction: column;
  }

  .panel.active {
    display: flex;
  }

  .panel-bar {
    background: #fff;
    border-bottom: 1px solid #e8e8e4;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-bar-info {
    font-size: 12px;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .open-link {
    font-size: 12px;
    color: #888;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border: 1px solid #e8e8e4;
    border-radius: 6px;
    transition: background 0.12s, color 0.12s;
  }

  .open-link:hover {
    background: #f5f5f3;
    color: #444;
  }

  .open-link svg {
    width: 12px;
    height: 12px;
  }

  iframe {
    flex: 1;
    border: none;
    width: 100%;
    min-height: calc(100vh - 105px);
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    해랑달
    <span>상점 열람</span>
  </div>
  <nav>
    <div class="tab active" onclick="switchTab('sheet')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="#34A853" stroke-width="1.5"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="#34A853" stroke-width="1.2"/>
        <line x1="3" y1="15" x2="21" y2="15" stroke="#34A853" stroke-width="1.2"/>
        <line x1="9" y1="3" x2="9" y2="21" stroke="#34A853" stroke-width="1.2"/>
        <line x1="15" y1="3" x2="15" y2="21" stroke="#34A853" stroke-width="1.2"/>
      </svg>
      상점현황
      <span class="badge badge-green">시트</span>
    </div>
    <div class="tab" onclick="switchTab('doc')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none">
        <rect x="4" y="2" width="16" height="20" rx="2" stroke="#4285F4" stroke-width="1.5"/>
        <line x1="8" y1="8" x2="16" y2="8" stroke="#4285F4" stroke-width="1.3"/>
        <line x1="8" y1="12" x2="16" y2="12" stroke="#4285F4" stroke-width="1.3"/>
        <line x1="8" y1="16" x2="13" y2="16" stroke="#4285F4" stroke-width="1.3"/>
      </svg>
      반영기록
      <span class="badge badge-blue">문서</span>
    </div>
  </nav>
</header>

<main>
  <div class="panel active" id="panel-sheet">
    <div class="panel-bar">
      <div class="panel-bar-info">
        <div class="dot"></div>
        실시간 연동 · Google Sheets
      </div>
      <a class="open-link" href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQfy1BOePoxCpwp5i7XQZifW5XVYgAvDBd7t1aFM6cXsv96EJMnAs6ILdpEJaW-nPpLd1J2FWgN-zYR/pubhtml" target="_blank">
        새 탭에서 열기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>
    <iframe
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQfy1BOePoxCpwp5i7XQZifW5XVYgAvDBd7t1aFM6cXsv96EJMnAs6ILdpEJaW-nPpLd1J2FWgN-zYR/pubhtml?widget=true&headers=false"
      title="상점현황 시트">
    </iframe>
  </div>

  <div class="panel" id="panel-doc">
    <div class="panel-bar">
      <div class="panel-bar-info">
        <div class="dot"></div>
        실시간 연동 · Google Docs
      </div>
      <a class="open-link" href="https://docs.google.com/document/d/e/2PACX-1vSp93LA5WhIFGxrax_hfa8Z5MZpB_8VVfOr7_j1d_RozGzNm1maPgDL-64JhmBLKutAGfkeX6XL-Lfc/pub" target="_blank">
        새 탭에서 열기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>
    <iframe
      src="https://docs.google.com/document/d/e/2PACX-1vSp93LA5WhIFGxrax_hfa8Z5MZpB_8VVfOr7_j1d_RozGzNm1maPgDL-64JhmBLKutAGfkeX6XL-Lfc/pub?embedded=true"
      title="상점 반영기록">
    </iframe>
  </div>
</main>

<script>
  function switchTab(target) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('panel-' + target).classList.add('active');
  }
</script>

</body>
</html>
